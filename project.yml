# XcodeGen spec for Vérité.
# Generate the Xcode project with:  xcodegen generate
# (brew install xcodegen)  — see docs/SETUP.md
name: Verite
options:
  bundleIdPrefix: com.verite
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "12"

targets:
  Verite:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Verite
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: Verite/Resources/Info.plist
        # Sign in with Apple is OFF for signing right now (the App ID doesn't
        # carry the capability yet, which fails release archiving). To enable:
        #   1. developer.apple.com → App ID com.verite.com → tick "Sign in with
        #      Apple", save (Codemagic regenerates the profile next build).
        #   2. Uncomment the line below.
        #   3. Set FeatureFlags.appleSignInEnabled = true.
        # CODE_SIGN_ENTITLEMENTS: Verite/Verite.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.verite.com
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        # The two feature-flag SDKs (StoreKit/Supabase) are OFF by default and
        # require no linked frameworks until their milestones are enabled.
    # DO NOT add an `info:` block here. XcodeGen REGENERATES the plist at
    # `info.path` on every `xcodegen generate` (CI runs it every build),
    # overwriting the hand-written Verite/Resources/Info.plist with 8 boiler-
    # plate keys — silently dropping UILaunchStoryboardName (=> tiny legacy
    # compatibility window on iPad), NSCameraUsageDescription, UIAppFonts,
    # orientations, and everything else. INFOPLIST_FILE above is sufficient.

schemes:
  Verite:
    build:
      targets:
        Verite: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
