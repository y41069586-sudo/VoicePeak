# XcodeGen spec for Vérité.
# Generate the Xcode project with:  xcodegen generate
# (brew install xcodegen)  — see docs/SETUP.md
name: Verite
options:
  bundleIdPrefix: com.verite
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Verite:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Verite
        excludes:
          - "**/*.md"
          - "**/*Tests.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verite.com
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        # The two feature-flag SDKs (StoreKit/Supabase) are OFF by default and
        # require no linked frameworks until their milestones are enabled.
    info:
      path: Verite/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Vérité
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        CFBundleLocalizations:
          - en
          - de
          - es
          - fr
          - it
        NSCameraUsageDescription: "Vérité uses the camera to analyze your skin and scan product barcodes. Photos are processed on your device and never uploaded."
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIRequiredDeviceCapabilities:
          - armv7
        UIAppFonts:
          - PlayfairDisplay.ttf
          - PlayfairDisplay-Italic.ttf

  VeriteTests:
    type: bundle
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Verite
        includes:
          - "**/*Tests.swift"
    dependencies:
      - target: Verite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verite.com.tests
        TEST_TARGET_NAME: Verite

schemes:
  Verite:
    build:
      targets:
        Verite: all
    run:
      config: Debug
    test:
      targets:
        - VeriteTests
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
