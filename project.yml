# XcodeGen spec for Vérité.
# Generate the Xcode project with:  xcodegen generate
# (brew install xcodegen)  — see docs/SETUP.md
name: Verite
options:
  bundleIdPrefix: com.verite
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Verite:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Verite
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: Verite/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.verite.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        # The two feature-flag SDKs (StoreKit/Supabase) are OFF by default and
        # require no linked frameworks until their milestones are enabled.
    info:
      path: Verite/Resources/Info.plist

schemes:
  Verite:
    build:
      targets:
        Verite: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
