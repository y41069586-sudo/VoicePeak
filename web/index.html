<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glowé</title>
  <meta property="og:title" content="Glowé — skin analysis in 60 seconds">
  <meta property="og:description" content="Scan your skin, get an honest score and a 14-day plan.">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #E7DBF3 0%, #D9C7EC 100%);
      color: #2A2140; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: 100%; max-width: 380px; text-align: center;
      background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.6);
      border-radius: 28px; padding: 40px 28px; backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(120,90,180,.18);
    }
    h1 { font-size: 34px; letter-spacing: 4px; margin: 0 0 6px; font-weight: 800; }
    p  { color: #5B5175; font-size: 15px; margin: 0 0 26px; }
    .btn {
      display: block; text-decoration: none; font-weight: 700; font-size: 16px;
      padding: 15px; border-radius: 16px; margin-top: 12px;
    }
    .primary { background: #7B5EC6; color: #fff; }
    .ghost   { background: transparent; color: #7B5EC6; border: 1.5px solid rgba(123,94,198,.4); }
  </style>
</head>
<body>
  <div class="card">
    <h1>GLOWÉ</h1>
    <p id="msg">Opening the app…</p>
    <a id="open" class="btn primary" href="#">Open Glowé</a>
    <!-- Replace with your real App Store link (also set in LinkConfig.appStoreURL). -->
    <a class="btn ghost" href="https://apps.apple.com/app/id0000000000">Get Glowé</a>
  </div>
  <script>
    // Hash carries the deep link:  #invite?code=ABC  ->  verite://invite?code=ABC
    var frag = location.hash.slice(1);
    if (frag) {
      var target = "verite://" + frag;
      document.getElementById("open").setAttribute("href", target);
      // Auto-launch the app; if it isn't installed nothing happens and the
      // buttons remain for a manual choice.
      window.location.href = target;
    } else {
      document.getElementById("msg").textContent = "Skin analysis in 60 seconds.";
      document.getElementById("open").style.display = "none";
    }
  </script>
</body>
</html>
