workflows:
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60

    xcode: latest

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.verite.app

      vars:
        XCODE_PROJECT: "Verite.xcodeproj"
        XCODE_SCHEME: "Verite"
        BUNDLE_ID: "com.verite.app"
        # optional (falls du Build-Version stabil halten willst)
        MARKETING_VERSION: "1.0.0"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build & sign IPA
        script: |
          set -o pipefail

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER MARKETING_VERSION=$MARKETING_VERSION"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # 🔥 WICHTIG: echte API Key Integration (NICHT nur "integration")
        api_key: $APP_STORE_CONNECT_API_KEY

        submit_to_testflight: true
        # optional später:
        # submit_to_app_store: true
        # release_type: MANUAL
