# Codemagic CI/CD — Vérité (iOS / SwiftUI)
#
# The repo ships an XcodeGen spec (project.yml) instead of a checked-in
# .xcodeproj, so every workflow generates the project first, then builds.
#
# `ios-compile-check` is the fast, unsigned simulator build — the green/red
# "does it compile?" signal. Add signing + TestFlight later once you have an
# Apple Developer account wired into Codemagic (see the commented workflow).

workflows:
  ios-compile-check:
    name: Vérité · Compile check (simulator, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Verite.xcodeproj"
        XCODE_SCHEME: "Verite"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/*"
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml
      - name: Build for iOS Simulator (no code signing)
        script: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

  # ----------------------------------------------------------------------------
