workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60

    xcode: latest

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.verite.app

      vars:
        XCODE_PROJECT: "Verite.xcodeproj"
        XCODE_SCHEME: "Verite"

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml

      - name: Set up signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key:
          key: $APP_STORE_CONNECT_KEY
          issuer_id: $APP_STORE_CONNECT_ISSUER_ID
          key_id: $APP_STORE_CONNECT_KEY_ID
        submit_to_testflight: true
