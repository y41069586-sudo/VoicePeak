# Codemagic CI/CD — Vérité (iOS / SwiftUI)
#
# The repo ships an XcodeGen spec (project.yml) instead of a checked-in
# .xcodeproj, so every workflow generates the project first, then builds.
#
#   • ios-compile-check → fast unsigned simulator build (the green/red "does it
#     compile?" signal). Runs on every push to a claude/* branch.
#   • ios-release       → signed build → TestFlight. Runs on a version tag (v*).
#
# SIGNING: this uses Codemagic's automatic code signing. Set it up in the UI
# (you've done this): connect App Store Connect and add your distribution
# certificate + provisioning profile for com.verite.com. The `ios_signing` block
# below + `xcode-project use-profiles` then pick them up — no signing secrets in
# this file. The `Verite` env-var group only needs the 3 API values used to
# UPLOAD to TestFlight (see the publishing block).
#
# BUILD NUMBER: ios-release stamps a Unix timestamp as the CFBundleVersion
# ("Determine next build number" step) — always numeric, always increasing,
# always higher than anything already uploaded, and needs no App Store Connect
# query that could fail. No hardcoded version to bump before every release.
# project.yml's CURRENT_PROJECT_VERSION is only a local-dev/compile-check
# fallback; the release workflow always overrides it at archive time.

workflows:
  ios-compile-check:
    name: Vérité · Compile check (simulator, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      groups:
        - Verite   # PERFECTCORP_API_KEY + PERFECTCORP_RSA_KEY (secure)
      vars:
        XCODE_PROJECT: "Verite.xcodeproj"
        XCODE_SCHEME: "Verite"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/*"
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Inject API secrets
        script: |
          # Overwrites the committed-empty DermiqSecrets.swift with the real
          # keys so this build runs the LIVE engines. Add these as Secure app
          # variables in the "Verite" group (already referenced below):
          #   PERFECTCORP_API_KEY  — YCE skin-analysis key (sk-…)
          #   PERFECTCORP_RSA_KEY  — the one-time base64 "secret key" block
          #   GEMINI_API_KEY       — Google AI Studio key (Potential image)
          # Any subset may be set; whatever is empty keeps that engine on mock.
          # Strip whitespace/newlines a PEM-style paste would carry (they break
          # the generated Swift string literal).
          # Strip ALL whitespace/newlines from every key — a value pasted with
          # a line break (the console wraps long keys visually) would otherwise
          # produce an unterminated Swift string literal and fail the build.
          API_CLEAN="$(printf '%s' "${PERFECTCORP_API_KEY:-}" | tr -d ' \t\r\n')"
          RSA_CLEAN="$(printf '%s' "${PERFECTCORP_RSA_KEY:-}" | tr -d ' \t\r\n')"
          GEMINI_CLEAN="$(printf '%s' "${GEMINI_API_KEY:-}" | tr -d ' \t\r\n')"
          {
            echo '// CI-GENERATED — values injected from Codemagic env vars. Never committed.'
            echo 'enum DermiqSecrets {'
            echo "    static let perfectCorpAPIKey = \"${API_CLEAN}\""
            echo "    static let perfectCorpRSAPublicKey = \"${RSA_CLEAN}\""
            echo "    static let geminiAPIKey = \"${GEMINI_CLEAN}\""
            echo '}'
          } > Verite/Dermiq/DermiqSecrets.swift
          echo "Analysis: $([ -n "${PERFECTCORP_API_KEY:-}" ] && [ -n "${PERFECTCORP_RSA_KEY:-}" ] && echo LIVE || echo mock)"
          echo "Potential: $([ -n "${GEMINI_API_KEY:-}" ] && echo LIVE || echo mock)"
      - name: Probe Perfect Corp auth (only when keys are set)
        script: |
          # Proves the keys + auth contract from CI (this container has open
          # network). Fails loudly on bad keys instead of letting the app
          # silently fall back to mock scores.
          if [ -z "${PERFECTCORP_API_KEY:-}" ] || [ -z "${PERFECTCORP_RSA_KEY:-}" ]; then
            echo "Keys not set — probe skipped"; exit 0
          fi
          # Normalize both values: drop any PEM header lines the console value
          # might carry, plus all whitespace/newlines.
          API_CLEAN="$(printf '%s' "$PERFECTCORP_API_KEY" | tr -d ' \t\r\n')"
          RSA_CLEAN="$(printf '%s' "$PERFECTCORP_RSA_KEY" | sed -E 's/-----[^-]*-----//g' | tr -d ' \t\r\n')"
          echo "API key: ${#API_CLEAN} chars (expect ~60-70, starts sk-)"
          echo "RSA key: ${#RSA_CLEAN} base64 chars (a valid key is exactly 216)"
          case "$RSA_CLEAN" in MIGf*) echo "  starts 'MIGf': yes";; *) echo "  starts 'MIGf': NO ← wrong value";; esac
          case "$RSA_CLEAN" in *IDAQAB) echo "  ends 'IDAQAB': yes";; *) echo "  ends 'IDAQAB': NO ← truncated/wrong";; esac
          echo "  length mod 4 = $(( ${#RSA_CLEAN} % 4 )) (must be 0; else a character is missing)"
          printf '%s\n' '-----BEGIN PUBLIC KEY-----' > /tmp/pc.pem
          printf '%s' "$RSA_CLEAN" | fold -w64 >> /tmp/pc.pem
          printf '\n%s\n' '-----END PUBLIC KEY-----' >> /tmp/pc.pem
          # Does the RSA value actually load as a public key?
          if ! openssl pkey -pubin -in /tmp/pc.pem -noout 2>/tmp/pc.keyerr; then
            echo "RSA PUBLIC KEY FAILED TO LOAD:"; cat /tmp/pc.keyerr
            echo "→ PERFECTCORP_RSA_KEY must be the console 'Secret key' / 'Geheimschlüssel'"
            echo "  (base64 starting MIGf…, ending …IDAQAB) — NOT the sk- API key."
            exit 1
          fi
          echo "RSA public key: loads OK"
          TS="$(($(date +%s) * 1000))"
          printf 'client_id=%s&timestamp=%s' "$API_CLEAN" "$TS" > /tmp/pc.payload
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pc.pem \
            -pkeyopt rsa_padding_mode:pkcs1 -in /tmp/pc.payload -out /tmp/pc.enc
          ID_TOKEN="$(base64 < /tmp/pc.enc | tr -d '\n')"
          RESP="$(curl -sS -X POST https://yce-api-01.perfectcorp.com/s2s/v1.0/client/auth \
            -H 'Content-Type: application/json' \
            -d "{\"client_id\":\"$API_CLEAN\",\"id_token\":\"$ID_TOKEN\"}")"
          echo "$RESP" | sed -E 's/"access_token" *: *"[^"]+"/"access_token":"***"/'
          echo "$RESP" | grep -q access_token \
            && echo "PERFECT CORP AUTH OK" \
            || { echo "PERFECT CORP AUTH FAILED — see response above"; exit 1; }
      - name: Probe Gemini key (only when set)
        script: |
          # Cheap validity check: list models. 200 = key works; 400/403 = bad
          # key. Fails the build loudly rather than silently falling back to
          # the on-device retouch.
          if [ -z "${GEMINI_API_KEY:-}" ]; then echo "GEMINI_API_KEY not set — probe skipped"; exit 0; fi
          CODE="$(curl -sS -o /tmp/gemini.json -w '%{http_code}' \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            https://generativelanguage.googleapis.com/v1beta/models)"
          if [ "$CODE" = "200" ]; then
            echo "GEMINI KEY OK"
          else
            echo "GEMINI KEY FAILED (HTTP $CODE):"
            head -c 400 /tmp/gemini.json
            exit 1
          fi
      - name: E2E API diagnostic (opt-in — set RUN_API_E2E=1; consumes 1 unit + 1 image credit)
        script: |
          # Runs the REAL data-plane end to end so we can see the actual API
          # responses and fix parsing. Gated on RUN_API_E2E so normal pushes
          # don't burn units. Never fails the build (diagnostic only).
          set +e
          if [ "${RUN_API_E2E:-}" != "1" ]; then echo "RUN_API_E2E != 1 — E2E diagnostic skipped"; exit 0; fi
          # Face-filling crop (ScanHero is a wide shot → "face too small").
          # Not under Verite/, so it is NOT bundled into the app.
          IMG="ci/facetest.jpg"
          SIZE=$(wc -c < "$IMG" | tr -d ' ')
          echo "=== test image: $IMG ($SIZE bytes) ==="

          echo "##################### PERFECT CORP #####################"
          if [ -n "${PERFECTCORP_API_KEY:-}" ] && [ -n "${PERFECTCORP_RSA_KEY:-}" ]; then
            API_CLEAN="$(printf '%s' "$PERFECTCORP_API_KEY" | tr -d ' \t\r\n')"
            RSA_CLEAN="$(printf '%s' "$PERFECTCORP_RSA_KEY" | sed -E 's/-----[^-]*-----//g' | tr -d ' \t\r\n')"
            printf '%s\n' '-----BEGIN PUBLIC KEY-----' > /tmp/e.pem
            printf '%s' "$RSA_CLEAN" | fold -w64 >> /tmp/e.pem
            printf '\n%s\n' '-----END PUBLIC KEY-----' >> /tmp/e.pem
            TS="$(($(date +%s) * 1000))"
            printf 'client_id=%s&timestamp=%s' "$API_CLEAN" "$TS" > /tmp/e.pl
            openssl pkeyutl -encrypt -pubin -inkey /tmp/e.pem -pkeyopt rsa_padding_mode:pkcs1 -in /tmp/e.pl -out /tmp/e.enc
            IDT="$(base64 < /tmp/e.enc | tr -d '\n')"
            TOKEN=$(curl -sS -X POST https://yce-api-01.perfectcorp.com/s2s/v1.0/client/auth \
              -H 'Content-Type: application/json' \
              -d "{\"client_id\":\"$API_CLEAN\",\"id_token\":\"$IDT\"}" | jq -r '.result.access_token // empty')
            echo "access_token: $([ -n "$TOKEN" ] && echo got || echo EMPTY)"

            # v2.0 for everything; responses use the "data" envelope (v1.x used
            # "result"), so parse both. jq helper: .result.X // .data.X
            echo "----- declare file @ /s2s/v2.0/file/skin-analysis -----"
            D=$(curl -sS -X POST "https://yce-api-01.perfectcorp.com/s2s/v2.0/file/skin-analysis" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d "{\"files\":[{\"content_type\":\"image/jpeg\",\"file_name\":\"scan.jpg\",\"file_size\":$SIZE}]}")
            echo "$D" | head -c 500; echo
            FID=$(echo "$D" | jq -r '(.result.files[0].file_id // .data.files[0].file_id) // empty')
            PUT_URL=$(echo "$D" | jq -r '(.result.files[0].requests[0].url // .data.files[0].requests[0].url) // empty')
            CT=$(echo "$D" | jq -r '(.result.files[0].requests[0].headers."Content-Type" // .data.files[0].requests[0].headers."Content-Type") // "image/jpeg"')
            echo "file_id: $([ -n "$FID" ] && echo got || echo EMPTY)"

            if [ -n "$FID" ] && [ -n "$PUT_URL" ]; then
              echo "----- PUT bytes to presigned url -----"
              PUTCODE=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT "$PUT_URL" -H "Content-Type: $CT" --data-binary @"$IMG")
              echo "PUT status: $PUTCODE"
              echo "----- start task @ /s2s/v2.0/task/skin-analysis -----"
              T=$(curl -sS -X POST "https://yce-api-01.perfectcorp.com/s2s/v2.0/task/skin-analysis" \
                -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                -d "{\"src_file_id\":\"$FID\",\"dst_actions\":[\"hd_texture\",\"hd_redness\",\"hd_pore\",\"hd_age_spot\",\"hd_radiance\",\"hd_moisture\",\"hd_acne\"],\"format\":\"json\"}")
              echo "$T" | head -c 700; echo
              TID=$(echo "$T" | jq -r '(.result.task_id // .data.task_id // .task_id) // empty')
              echo "task_id: ${TID:-EMPTY}"
              if [ -n "$TID" ]; then
                LAST=""
                for i in $(seq 1 30); do
                  sleep 5
                  P=$(curl -sS "https://yce-api-01.perfectcorp.com/s2s/v2.0/task/skin-analysis/$TID" -H "Authorization: Bearer $TOKEN")
                  LAST="$P"
                  ST=$(echo "$P" | jq -r '(.data.task_status // .data.status // .data.state // "running")')
                  # results_filled = a non-empty object/array (empty {} means
                  # still running — do NOT stop on that).
                  FILLED=$(echo "$P" | jq -r '((.data.results // {}) | if ((type=="object" and (length>0)) or (type=="array" and (length>0))) then "yes" else "no" end)' 2>/dev/null)
                  echo "poll $i: task_status=$ST results_filled=$FILLED"
                  case "$ST" in success|done|completed|finished|error|failed|fail) break;; esac
                  [ "$FILLED" = "yes" ] && break
                done
                echo "===== FINAL / LAST POLL RESPONSE ====="; echo "$LAST" | head -c 6000; echo
              fi
            else
              echo ">>> declare failed to yield a file_id/url — see response above"
            fi
          else
            echo "Perfect Corp keys not set"
          fi
          echo "(Gemini image test skipped — needs billing; app uses on-device fallback.)"
          echo "=== E2E diagnostic done ==="
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Build for iOS Simulator (no code signing)
        script: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    # ⬇⬇⬇ REPLACE with the EXACT name of your App Store Connect integration
    # (Codemagic → Team settings → Integrations → App Store Connect — the name you
    # gave it when you connected Apple). This one integration does BOTH the signing
    # (auto-creates the cert + profile for com.verite.com) AND the TestFlight upload.
    integrations:
      app_store_connect: "Verite 1"
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        # bundle_identifier is REQUIRED by Codemagic. It is matched as a
        # PREFIX, so `com.verite.com` also covers the embedded widget
        # (`com.verite.com.widget`) — Codemagic fetches/creates profiles for
        # both. Both App IDs must have the `group.verite.com` App Group
        # enabled in the developer portal.
        bundle_identifier: com.verite.com
      groups:
        - Verite   # PERFECTCORP_API_KEY + PERFECTCORP_RSA_KEY (secure)
      vars:
        XCODE_PROJECT: "Verite.xcodeproj"
        XCODE_SCHEME: "Verite"
        BUNDLE_ID: "com.verite.com"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Inject API secrets
        script: |
          # Same injection as the compile-check workflow (see comments there).
          # No auth probes here — a transient API outage must not block a
          # release; the app falls back to mock engines at runtime if a live
          # call fails.
          # Strip ALL whitespace/newlines from every key — a value pasted with
          # a line break (the console wraps long keys visually) would otherwise
          # produce an unterminated Swift string literal and fail the build.
          API_CLEAN="$(printf '%s' "${PERFECTCORP_API_KEY:-}" | tr -d ' \t\r\n')"
          RSA_CLEAN="$(printf '%s' "${PERFECTCORP_RSA_KEY:-}" | tr -d ' \t\r\n')"
          GEMINI_CLEAN="$(printf '%s' "${GEMINI_API_KEY:-}" | tr -d ' \t\r\n')"
          {
            echo '// CI-GENERATED — values injected from Codemagic env vars. Never committed.'
            echo 'enum DermiqSecrets {'
            echo "    static let perfectCorpAPIKey = \"${API_CLEAN}\""
            echo "    static let perfectCorpRSAPublicKey = \"${RSA_CLEAN}\""
            echo "    static let geminiAPIKey = \"${GEMINI_CLEAN}\""
            echo '}'
          } > Verite/Dermiq/DermiqSecrets.swift
          echo "Analysis: $([ -n "${PERFECTCORP_API_KEY:-}" ] && [ -n "${PERFECTCORP_RSA_KEY:-}" ] && echo LIVE || echo mock)"
          echo "Potential: $([ -n "${GEMINI_API_KEY:-}" ] && echo LIVE || echo mock)"
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Set up signing
        script: |
          # Diagnostic + best-effort widget provisioning. Do NOT abort on the
          # API probes — we want the full picture in the log even if a call
          # fails. (`set -e` is re-enabled just before use-profiles.)
          set +e

          echo "=== App Store Connect API credential presence ==="
          [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]     && echo "issuer id:   SET" || echo "issuer id:   MISSING"
          [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] && echo "key id:      SET" || echo "key id:      MISSING"
          [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]    && echo "private key: SET" || echo "private key: MISSING"

          echo "=== list-certificates (raw stdout+stderr, first 40 lines) ==="
          app-store-connect list-certificates --json 2>&1 | head -40
          echo "=== list-bundle-ids com.verite.com.widget (raw, first 40 lines) ==="
          app-store-connect list-bundle-ids --bundle-id-identifier com.verite.com.widget --json 2>&1 | head -40
          echo "================================================================"

          # Best-effort: mint the widget's App Store profile from the cert +
          # App-ID resource ids. create-profile needs only the certificate's
          # RESOURCE id (not its private key). The profile inherits the App
          # Group enabled on com.verite.com.widget.
          CERT_ID=$(app-store-connect list-certificates --json 2>/dev/null | python3 -c "import sys,json,re; m=re.search(r'\[.*\]', sys.stdin.read(), re.S); d=json.loads(m.group(0)) if m else []; ids=[c['id'] for c in d if isinstance(c,dict) and 'DISTRIBUTION' in ((c.get('attributes') or {}).get('certificateType') or '')]; print(ids[0] if ids else (d[0]['id'] if d and isinstance(d[0],dict) else ''))" 2>/dev/null)
          WIDGET_APPID=$(app-store-connect list-bundle-ids --bundle-id-identifier com.verite.com.widget --bundle-id-identifier-strict-match --json 2>/dev/null | python3 -c "import sys,json,re; m=re.search(r'\[.*\]', sys.stdin.read(), re.S); d=json.loads(m.group(0)) if m else []; print(d[0]['id'] if d and isinstance(d[0],dict) else '')" 2>/dev/null)
          echo "Parsed -> cert id: ${CERT_ID:-NONE} | widget app id: ${WIDGET_APPID:-NONE}"
          if [ -n "$CERT_ID" ] && [ -n "$WIDGET_APPID" ]; then
            app-store-connect create-profile "$WIDGET_APPID" "$CERT_ID" --type IOS_APP_STORE --name "Verite Widget CI $(date +%s)" --save \
              && echo "Widget App Store profile created + saved." \
              || echo "WARNING: create-profile failed (see output above)."
          else
            echo "WARNING: could not resolve cert / widget App ID; widget profile not minted."
          fi

          # Apply all downloaded profiles to the generated project.
          set -e
          xcode-project use-profiles
      - name: Determine next build number
        script: |
          set -e
          # Use a Unix timestamp as the build number. It is numeric, strictly
          # increasing on every build, and always far higher than anything
          # already uploaded (previous uploads were single/double digits).
          # This needs NO App Store Connect query, so it cannot fail on API
          # or CLI quirks — the class of error that broke every prior upload
          # (hardcoded 11, then a fallback 1, then an unsupported list-apps
          # call). A timestamp (~1.7e9) stays well under the CFBundleVersion
          # numeric limit, so it is always a valid, accepted build number.
          NEXT_BUILD_NUMBER=$(date +%s)
          echo "Using timestamp build number: $NEXT_BUILD_NUMBER"
          echo "NEXT_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> $CM_ENV
      - name: Stamp build version into Info.plist
        script: |
          PLIST="$CM_BUILD_DIR/Verite/Resources/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.3" "$PLIST"
          echo "Stamped CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' $PLIST)"
      - name: Build & sign IPA
        script: |
          set -o pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$NEXT_BUILD_NUMBER MARKETING_VERSION=1.0.3"
      - name: Verify IPA packaging (plist keys, launch screen)
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Checking $IPA"
          # The compiled launch storyboard MUST be in the bundle — without it
          # iOS letterboxes the app into the tiny legacy canvas on iPad.
          unzip -l "$IPA" | grep -q "LaunchScreen.storyboardc" \
            || { echo "ERROR: LaunchScreen.storyboardc missing from the app bundle"; exit 1; }
          # Ground truth: inspect the BUILT Info.plist. XcodeGen used to
          # regenerate/clobber the source plist during `xcodegen generate`
          # (see project.yml), which silently stripped these keys from every
          # previous build. Fail loudly if that ever happens again.
          TMP=$(mktemp -d)
          unzip -q "$IPA" "Payload/*.app/Info.plist" -d "$TMP"
          PLIST=$(ls "$TMP"/Payload/*.app/Info.plist)
          for key in UILaunchStoryboardName NSCameraUsageDescription UIAppFonts; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" > /dev/null 2>&1 \
              || { echo "ERROR: $key missing from the BUILT Info.plist — plist was clobbered"; exit 1; }
          done
          echo "Built plist: CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST"), launch=$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$PLIST")"
          echo "Packaging OK: plist intact, launch storyboard present"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration          # uses the integration referenced above
        submit_to_testflight: true
        # submit_to_app_store: false   # flip on (+ release_type) for a public release
