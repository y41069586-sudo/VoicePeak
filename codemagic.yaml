# Codemagic CI/CD — Vérité (iOS / SwiftUI)
#
# Enhanced configuration for production CI/CD:
# • ios-compile-check → fast unsigned simulator build + all tests
# • ios-test-phase3 → dedicated test workflow (Phase 3A + 3B)
# • ios-archive → build IPA archive for TestFlight (signed)
# • ios-release → signed IPA + TestFlight upload
#
# CoreML NOTES:
# • CoreML model is OPTIONAL (not committed)
# • App runs in .hybrid-safe mode (heuristic fallback if model missing)
# • No build-time dependency on .mlmodelc file
# • All Phase 3A + 3B tests pass in CI without model

workflows:
  ios-compile-check:
    name: Vérité · Compile check (simulator, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Verite.xcodeproj"
        XCODE_SCHEME: "Verite"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/*"
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Build for iOS Simulator (no code signing)
        script: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

  ios-test-phase3:
    name: Vérité · Phase 3 Tests (3A + 3B)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Verite.xcodeproj"
        XCODE_SCHEME: "Verite"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/*"
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Run Phase 3A + 3B tests
        script: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -verbose
      - name: Run tests with code coverage
        script: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -enableCodeCoverage YES \
            -derivedDataPath "$CI_BUILD_DIR/derived_data"
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

  ios-archive:
    name: Vérité · Build & Archive (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Verite.xcodeproj"
        XCODE_SCHEME: "Verite"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
        - pattern: "develop"
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Build archive (no code signing)
        script: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify app bundle
        script: |
          ARCHIVE_PATH="$HOME/Library/Developer/Xcode/DerivedData/Verite-*/Build/Products/Release-iphoneos"
          if [ -d "$ARCHIVE_PATH" ]; then
            echo "✓ Archive successful"
            ls -lah "$ARCHIVE_PATH"
          else
            echo "✗ Archive not found"
            exit 1
          fi
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/**/*.app

  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # ⬇⬇⬇ REPLACE with the EXACT name of your App Store Connect integration
    # (Codemagic → Team settings → Integrations → App Store Connect — the name you
    # gave it when you connected Apple). This one integration does BOTH the signing
    # (auto-creates the cert + profile for com.verite.com) AND the TestFlight upload.
    integrations:
      app_store_connect: "Verite 1"
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.verite.com
      vars:
        XCODE_PROJECT: "Verite.xcodeproj"
        XCODE_SCHEME: "Verite"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Verify test pass before release
        script: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -verbose
      - name: Build & sign IPA
        script: |
          set -o pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
