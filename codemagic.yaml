# Codemagic CI/CD — Vérité (iOS / SwiftUI)
#
# The repo ships an XcodeGen spec (project.yml) instead of a checked-in
# .xcodeproj, so every workflow generates the project first, then builds.
#
#   • ios-compile-check → fast unsigned simulator build (the green/red "does it
#     compile?" signal). Runs on every push to a claude/* branch.
#   • ios-release       → signed build → TestFlight. Runs on a version tag (v*).
#
# SIGNING: this uses Codemagic's automatic code signing. Set it up in the UI
# (you've done this): connect App Store Connect and add your distribution
# certificate + provisioning profile for com.verite.com. The `ios_signing` block
# below + `xcode-project use-profiles` then pick them up — no signing secrets in
# this file. The `Verite` env-var group only needs the 3 API values used to
# UPLOAD to TestFlight (see the publishing block).
#
# BUILD NUMBER: ios-release stamps a Unix timestamp as the CFBundleVersion
# ("Determine next build number" step) — always numeric, always increasing,
# always higher than anything already uploaded, and needs no App Store Connect
# query that could fail. No hardcoded version to bump before every release.
# project.yml's CURRENT_PROJECT_VERSION is only a local-dev/compile-check
# fallback; the release workflow always overrides it at archive time.

workflows:
  ios-compile-check:
    name: Vérité · Compile check (simulator, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      groups:
        - Verite   # PERFECTCORP_API_KEY + PERFECTCORP_RSA_KEY (secure)
      vars:
        XCODE_PROJECT: "Verite.xcodeproj"
        XCODE_SCHEME: "Verite"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/*"
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Inject API secrets
        script: |
          # Overwrites the committed-empty DermiqSecrets.swift with the real
          # keys so this build runs the LIVE engines. Add these as Secure app
          # variables in the "Verite" group (already referenced below):
          #   PERFECTCORP_API_KEY  — YCE skin-analysis key (sk-…)
          #   PERFECTCORP_RSA_KEY  — the one-time base64 "secret key" block
          #   GEMINI_API_KEY       — Google AI Studio key (Potential image)
          # Any subset may be set; whatever is empty keeps that engine on mock.
          # Strip whitespace/newlines a PEM-style paste would carry (they break
          # the generated Swift string literal).
          RSA_CLEAN="$(printf '%s' "${PERFECTCORP_RSA_KEY:-}" | tr -d ' \r\n')"
          {
            echo '// CI-GENERATED — values injected from Codemagic env vars. Never committed.'
            echo 'enum DermiqSecrets {'
            echo "    static let perfectCorpAPIKey = \"${PERFECTCORP_API_KEY:-}\""
            echo "    static let perfectCorpRSAPublicKey = \"${RSA_CLEAN}\""
            echo "    static let geminiAPIKey = \"${GEMINI_API_KEY:-}\""
            echo '}'
          } > Verite/Dermiq/DermiqSecrets.swift
          echo "Analysis: $([ -n "${PERFECTCORP_API_KEY:-}" ] && [ -n "${PERFECTCORP_RSA_KEY:-}" ] && echo LIVE || echo mock)"
          echo "Potential: $([ -n "${GEMINI_API_KEY:-}" ] && echo LIVE || echo mock)"
      - name: Probe Perfect Corp auth (only when keys are set)
        script: |
          # Proves the keys + auth contract from CI (this container has open
          # network). Fails loudly on bad keys instead of letting the app
          # silently fall back to mock scores.
          if [ -z "${PERFECTCORP_API_KEY:-}" ] || [ -z "${PERFECTCORP_RSA_KEY:-}" ]; then
            echo "Keys not set — probe skipped"; exit 0
          fi
          printf '%s\n' '-----BEGIN PUBLIC KEY-----' > /tmp/pc.pem
          printf '%s' "$PERFECTCORP_RSA_KEY" | tr -d ' \n' | fold -w64 >> /tmp/pc.pem
          printf '\n%s\n' '-----END PUBLIC KEY-----' >> /tmp/pc.pem
          TS="$(($(date +%s) * 1000))"
          printf 'client_id=%s&timestamp=%s' "$PERFECTCORP_API_KEY" "$TS" > /tmp/pc.payload
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pc.pem -in /tmp/pc.payload -out /tmp/pc.enc
          ID_TOKEN="$(base64 < /tmp/pc.enc | tr -d '\n')"
          RESP="$(curl -sS -X POST https://yce-api-01.perfectcorp.com/s2s/v1.0/client/auth \
            -H 'Content-Type: application/json' \
            -d "{\"client_id\":\"$PERFECTCORP_API_KEY\",\"id_token\":\"$ID_TOKEN\"}")"
          echo "$RESP" | sed -E 's/"access_token" *: *"[^"]+"/"access_token":"***"/'
          echo "$RESP" | grep -q access_token \
            && echo "PERFECT CORP AUTH OK" \
            || { echo "PERFECT CORP AUTH FAILED — check both variables in Codemagic"; exit 1; }
      - name: Probe Gemini key (only when set)
        script: |
          # Cheap validity check: list models. 200 = key works; 400/403 = bad
          # key. Fails the build loudly rather than silently falling back to
          # the on-device retouch.
          if [ -z "${GEMINI_API_KEY:-}" ]; then echo "GEMINI_API_KEY not set — probe skipped"; exit 0; fi
          CODE="$(curl -sS -o /tmp/gemini.json -w '%{http_code}' \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            https://generativelanguage.googleapis.com/v1beta/models)"
          if [ "$CODE" = "200" ]; then
            echo "GEMINI KEY OK"
          else
            echo "GEMINI KEY FAILED (HTTP $CODE):"
            head -c 400 /tmp/gemini.json
            exit 1
          fi
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Build for iOS Simulator (no code signing)
        script: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    # ⬇⬇⬇ REPLACE with the EXACT name of your App Store Connect integration
    # (Codemagic → Team settings → Integrations → App Store Connect — the name you
    # gave it when you connected Apple). This one integration does BOTH the signing
    # (auto-creates the cert + profile for com.verite.com) AND the TestFlight upload.
    integrations:
      app_store_connect: "Verite 1"
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.verite.com
      groups:
        - Verite   # PERFECTCORP_API_KEY + PERFECTCORP_RSA_KEY (secure)
      vars:
        XCODE_PROJECT: "Verite.xcodeproj"
        XCODE_SCHEME: "Verite"
        BUNDLE_ID: "com.verite.com"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Inject API secrets
        script: |
          # Same injection as the compile-check workflow (see comments there).
          # No auth probes here — a transient API outage must not block a
          # release; the app falls back to mock engines at runtime if a live
          # call fails.
          RSA_CLEAN="$(printf '%s' "${PERFECTCORP_RSA_KEY:-}" | tr -d ' \r\n')"
          {
            echo '// CI-GENERATED — values injected from Codemagic env vars. Never committed.'
            echo 'enum DermiqSecrets {'
            echo "    static let perfectCorpAPIKey = \"${PERFECTCORP_API_KEY:-}\""
            echo "    static let perfectCorpRSAPublicKey = \"${RSA_CLEAN}\""
            echo "    static let geminiAPIKey = \"${GEMINI_API_KEY:-}\""
            echo '}'
          } > Verite/Dermiq/DermiqSecrets.swift
          echo "Analysis: $([ -n "${PERFECTCORP_API_KEY:-}" ] && [ -n "${PERFECTCORP_RSA_KEY:-}" ] && echo LIVE || echo mock)"
          echo "Potential: $([ -n "${GEMINI_API_KEY:-}" ] && echo LIVE || echo mock)"
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Determine next build number
        script: |
          set -e
          # Use a Unix timestamp as the build number. It is numeric, strictly
          # increasing on every build, and always far higher than anything
          # already uploaded (previous uploads were single/double digits).
          # This needs NO App Store Connect query, so it cannot fail on API
          # or CLI quirks — the class of error that broke every prior upload
          # (hardcoded 11, then a fallback 1, then an unsupported list-apps
          # call). A timestamp (~1.7e9) stays well under the CFBundleVersion
          # numeric limit, so it is always a valid, accepted build number.
          NEXT_BUILD_NUMBER=$(date +%s)
          echo "Using timestamp build number: $NEXT_BUILD_NUMBER"
          echo "NEXT_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> $CM_ENV
      - name: Stamp build version into Info.plist
        script: |
          PLIST="$CM_BUILD_DIR/Verite/Resources/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.3" "$PLIST"
          echo "Stamped CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' $PLIST)"
      - name: Build & sign IPA
        script: |
          set -o pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$NEXT_BUILD_NUMBER MARKETING_VERSION=1.0.3"
      - name: Verify IPA packaging (plist keys, launch screen)
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Checking $IPA"
          # The compiled launch storyboard MUST be in the bundle — without it
          # iOS letterboxes the app into the tiny legacy canvas on iPad.
          unzip -l "$IPA" | grep -q "LaunchScreen.storyboardc" \
            || { echo "ERROR: LaunchScreen.storyboardc missing from the app bundle"; exit 1; }
          # Ground truth: inspect the BUILT Info.plist. XcodeGen used to
          # regenerate/clobber the source plist during `xcodegen generate`
          # (see project.yml), which silently stripped these keys from every
          # previous build. Fail loudly if that ever happens again.
          TMP=$(mktemp -d)
          unzip -q "$IPA" "Payload/*.app/Info.plist" -d "$TMP"
          PLIST=$(ls "$TMP"/Payload/*.app/Info.plist)
          for key in UILaunchStoryboardName NSCameraUsageDescription UIAppFonts; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" > /dev/null 2>&1 \
              || { echo "ERROR: $key missing from the BUILT Info.plist — plist was clobbered"; exit 1; }
          done
          echo "Built plist: CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST"), launch=$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$PLIST")"
          echo "Packaging OK: plist intact, launch storyboard present"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration          # uses the integration referenced above
        submit_to_testflight: true
        # submit_to_app_store: false   # flip on (+ release_type) for a public release
